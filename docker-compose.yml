# 喜马拉雅自动下载 —— 跑在飞牛 fnOS 上，Windows 可以关机。
#
# 项目目录：飞牛 /vol2/1000/docker/ximalaya-auto/
#   飞牛的 docker 项目统一放 /vol2/1000/docker/ 下（同目录还有 audiobookshelf、
#   pansou1、xianyu 等 20 来个）。注意**只放项目本身**：
#   下载产物在 /vol1/1000/youshengshu（ABS 媒体库），那块盘有 1.4T 空余，
#   而 /vol2 只剩十几 G，绝对不要把下载目录改到 /vol2。
#
# ⚠️ 部署前必须先准备，尤其是凭据：
#   1) 在**有屏幕的 Windows** 上跑一次  node login.js  扫码登录
#   2) 把 C:\Users\<你>\.xmd 里的文件拷进本目录的 xmd/
#   3) 本目录的 config/ 下要有这两个**文件**（挂的是目录，但容器里读的是文件，
#      缺了不会报错、只会静默按「没有订阅」处理）：
#          config/albums.txt          订阅列表
#          config/albums.meta.json    手工元数据（作者）
#
# 启动：      docker compose -p ximalaya-auto up -d --build
# 看日志：    docker compose -p ximalaya-auto logs -f
# 手动跑一轮：docker compose -p ximalaya-auto exec ximalaya-auto node scheduler.js --once
# 试运行：    docker compose -p ximalaya-auto exec ximalaya-auto node scheduler.js --once --dry-run
#
# 网页控制台：http://<飞牛IP>:8787/  —— 加订阅、看进度、暂停/继续。
#   网页和调度器跑在同一个进程里（由 scheduler.js 拉起，不是独立容器），
#   这样才能共享暂停状态、并且掐得掉正在下载的子进程。
#
# 加订阅：网页上填，或者直接编辑 config/albums.txt，一行一个专辑 ID 或链接。
#   两种方式下一轮都自动生效，不用重启。
services:
  ximalaya-auto:
    build: .
    image: ximalaya-auto:local
    container_name: ximalaya-auto
    restart: unless-stopped
    # 常驻进程 + 子进程，交给 init 收尸，避免僵尸进程堆积
    init: true
    ports:
      # 网页控制台。飞牛上 8787 是空的（已确认没被别的容器占）。
      # 只打算在局域网里用，面板没有登录鉴权 —— 介意的话用防火墙挡住外网即可。
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      # 同一份镜像要在本机和飞牛两处跑，差异只在下载目录和调度参数，用环境变量注入
      XMD_ARCHIVES: /downloads
      XMD_WEB_PORT: "8787"
      XMD_SCHEDULE_ALBUMS_FILE: config/albums.txt
      # 常规周期。2026-09-29 从 12 小时改成 6 小时：配合下面的主动避让，
      # 一天正好 4 轮 × 240 集 ≈ 950 集。
      # 注意不是「每 6 小时整点跑」，而是「每轮结束后睡 6 小时」；当天额度下满时会
      # 提前睡到次日 00:05，所以这点偏移每天都会被重新对齐一次，不会越漂越远。
      XMD_SCHEDULE_INTERVAL_HOURS: "6"
      # 无人值守建议压低并发，别被平台风控
      XMD_SCHEDULE_CONCURRENCY: "3"
      # 慢速模式：并发 1，且每集之间随机等 0.5~5 秒。
      # 实测快速模式下 1589 集的专辑 3~4 秒能下 10 集，日志自己都在警告
      # 「当前为快速模式,很容易被官方大大踢屁屁哦」。无人值守最怕的就是跑到一半
      # 被限流，那样后面整晚都白跑，所以这里主动放慢 —— 剩下的量也就一小时的差别。
      # 想换回快的：改成 "false" 或者删掉这一行。
      XMD_SCHEDULE_SLOW: "true"
      # 失败后的重试节奏（2026-09-28 修订，三段式 → 四段式）。
      #
      # 先纠正两个认知错误：
      #   之一：额度**不是**「整点重置」—— 那是上游 README 里 2024-05-22 的结论，
      #         到 2026 年早就失效了（跨 12 个整点一个都没回来）。
      #   之二（2026-09-28 才查清）：额度其实有**两道**上限，旧策略把两道混成了一道。
      #         ① 单轮上限 ≈ 301 集，撞上后约 1 小时就恢复；
      #         ② 当日上限 ≈ 990 集，这个才要等自然日。
      #         证据：9/28 两轮独立复现都是正好 301 集（792→1093、1093→1394）；
      #         9/27 三个整点 burst 也各 301 集，相隔 34~70 分钟；而当日总量 9/26=989、9/27=991。
      #
      # 所以重试策略分四段：
      #   ① 成功              → XMD_SCHEDULE_INTERVAL_HOURS 常规周期
      #   ② 失败、但有新增集数 → XMD_SCHEDULE_PROGRESS_RETRY_MINUTES（默认 60）分钟后再来。
      #                          撞的是单轮上限，额度还在，睡够冷却就能接着下 —— 旧策略在这里
      #                          退避到次日，实测 9/28 白睡 21 小时、当天只拿到 602 集。
      #   ③ 失败、一集没捞到   → 每 30 分钟试一次，共 6 次（= 3 小时），覆盖瞬时 / 小时级风控。
      #   ④ 短试用尽仍 0 集    → 退避到次日 00:05 再试。既然确定是日额度，盲试纯属浪费。
      XMD_SCHEDULE_RETRY_MINUTES: "30"
      XMD_SCHEDULE_MAX_RETRIES: "6"
      XMD_SCHEDULE_PROGRESS_RETRY_MINUTES: "60"
      XMD_SCHEDULE_BACKOFF_AT: "00:05"
      # ---- 主动避让（2026-09-29 起）----
      # 上面那四段是「撞墙之后怎么办」，这两行是「别去撞墙」。
      #
      # 为什么不继续靠撞墙：单轮上限和当日上限返回的都是 ret:1001「系统繁忙」，
      # 从错误码上根本分不出来，只能靠「本轮有没有新增集数」猜；而单轮那道墙的
      # 实际产出还在 90~497 之间飘（众数 301）。被动撞一次就白等一小时起步，
      # 9/28 就是这么白睡了 21 小时、当天只拿到 602 集。
      #
      # 数字是按实测的墙留余量倒推的：
      #   单轮 240 < 实测 301（众数）  —— 下满 240 就主动收工，算正常结束，不退避
      #   当日 950 < 实测 990         —— 累计到 950 就睡到次日 00:05
      #   4 轮 × 240 ≈ 950            —— 配 6 小时周期，一天正好四轮
      # 每轮真正的上限 = min(单轮上限, 当日剩余)，所以第四轮只会下 950-720=230 集，
      # 一天的总量不会超。当日计数落在 logs/daily-state.json，重建容器也不会忘。
      # 想退回老的「撞墙才收手」：把这两行删掉或设成 "0"。
      XMD_SCHEDULE_MAX_PER_ROUND: "240"
      XMD_SCHEDULE_DAILY_CAP: "950"
      # ---- 多账号（2026-09-29 起）----
      # 逗号分隔的账号名，**顺序就是轮转顺序**。不设 = 只有一个 default 账号。
      #   default  = 老的 ~/.xmd 目录本身（现有凭据原地不动，向后兼容）
      #   其它名字 = ~/.xmd/accounts/<名字>/（容器里 /root/.xmd/accounts/<名字>/，
      #              在同一个挂载卷里，持久化）
      # 每个账号仍然是「每 XMD_SCHEDULE_INTERVAL_HOURS 一轮」，但**交替上场**，
      # 所以两轮之间只隔 intervalHours / 账号数 —— 2 个账号 = 每 3 小时跑一轮。
      # 每个账号各自享有单轮 240 / 当日 950 的预算（平台按账号分别计数），
      # 日产量因此翻倍；同一时刻永远只有一个账号在下，不会同时下、不会互相抢。
      # 当日计数按账号分开记在 logs/daily-state.json。
      #
      # 加第二个账号：
      #   1) 本机（要有屏幕，得扫码）：XMD_XMD_DIR=xmd/accounts/bob node login.js
      #   2) 把 www2-cookies.json / mac-cookies.json 拷到
      #      飞牛:/vol2/1000/docker/ximalaya-auto/xmd/accounts/bob/
      #      device-info.json 不拷也行 —— 账号目录里没有就自动用根目录那份
      #      （同一台机器本来就是同一个指纹）。想让 bob 算另一台设备：
      #      本机 XMD_FP_BROWSER=chrome node collect-fingerprint.js 另采一份丢进
      #      accounts/bob/，但采集时必须能连上 hdaa.shuzilm.cn（见 SKILL §2），
      #      连不上采出来的指纹是「没注册过」的，容器里用不了。
      #   3) 这行改成 "default,bob"，再 docker compose -p ximalaya-auto up -d
      #      —— 只动环境变量，不用 build
      # 某个账号凭据没配好时只会跳过它（日志里 log.error），其它账号照常跑。
      XMD_SCHEDULE_ACCOUNTS: "default"
      # 占位符：{title} {anchor} {author} {count} {status}
      XMD_NAMING_TEMPLATE: "《{title}》{anchor} {author}"
    volumes:
      # 登录凭据 + 下载进度数据库。必须持久化，否则每次重建容器都要重下全部
      - ./xmd:/root/.xmd
      # 订阅列表 + 手工元数据，整个目录挂，别单文件挂（宿主机上文件不存在时
      # Docker 会创建一个同名目录，容器里读到目录直接报错）
      - ./config:/app/config
      - ./logs:/app/logs
      # 直接下进 ABS 媒体库，省掉「下完再推送」那一步
      - /vol1/1000/youshengshu:/downloads
